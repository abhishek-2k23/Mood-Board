<div class="header">
    <nav>
       <p class="logo"> Mood Board</p>
       <div>
        <a routerLink="/">Home</a>
   <a routerLink="/about">About</a>
   
       </div>
       <div class="authbutton">
        <fa-icon (click) = "toggleTheme()" style="cursor: pointer;" [icon]="isDarkMode? faMoon : faSun" ></fa-icon>
        <span *ngIf="!userName">
            <a routerLink="/login">Login</a>
        </span>
        <span class="authbutton" *ngIf="userName">
            <p>{{userName}}</p>
            <a (click)="logout()" class="authbutton">
                <p>logout</p>
                <fa-icon [icon]="faLongArrowAltRight" style="margin-left: -10px;"></fa-icon>
            </a>
        </span>
    
       </div>
    </nav>
   
</div>
